name: Mirror to GitHub
on:
  push:
    branches: [master]

jobs:
  mirror:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitHub
        shell: bash
        env:
          GH_SSH_KEY_B64: ${{ secrets.GH_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$GH_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "secret length: ${#GH_SSH_KEY_B64}"
          echo "key file bytes: $(wc -c < ~/.ssh/id_ed25519)"
          ssh-keygen -lf ~/.ssh/id_ed25519 || echo "KEY PARSE FAILED"
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote add github git@github.com:mpetruc/hister_pdf_proxy.git
          git push --mirror github
